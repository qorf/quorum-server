
server {
    listen 80;
    listen [::]:80;
    server_name quorum.codes;

    root /html;
    allow all;

    index index.html index.htm;

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    server_name www.quorum.codes;
    return 301 $scheme://quorum.codes$request_uri;
}